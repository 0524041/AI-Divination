[project]
name = "ai-divination-backend"
version = "6.1.0"
description = "AI 算命網頁 - 後端 API 服務"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
    "cryptography>=41.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "lunar-python>=1.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "google-genai>=0.3.0",
    "openai>=1.0.0",
    "iztro-py>=0.3.3",
]

[project.scripts]
start = "uvicorn app.main:app --host 0.0.0.0 --port 8000"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort
# 排除 B008(Depends in defaults 為 FastAPI 慣例) 等規則，維持既有程式碼風格穩定
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
